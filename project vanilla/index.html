<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="./main.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrapper">
      <h2>Chronometre parité</h2>
      <p>
        Total: <span id="seconds-total">00</span>:<span id="tens-total"
          >00</span
        >
      </p>
      <p>H: <span id="seconds-m">00</span>:<span id="tens-m">00</span></p>
      <p>F: <span id="seconds-f">00</span>:<span id="tens-f">00</span></p>
      <p>NB: <span id="seconds-nb">00</span>:<span id="tens-nb">00</span></p>
      <button id="button-start-m">Start H</button>
      <button id="button-start-f">Start F</button>
      <button id="button-start-nb">Start NB</button>
      <button id="button-stop">Stop</button>
      <button id="button-reset">Reset</button>
    </div>
  </body>
</html>
